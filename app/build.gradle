apply plugin: 'com.android.application'
apply plugin: 'jacoco'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def rawReleaseStoreFile = keystoreProperties['storeFile'] ?: System.getenv("SOPA_STORE_FILE") ?: "/Users/david/Library/Mobile Documents/com~apple~CloudDocs/keys/sopa.jks"
def releaseStoreFile = rawReleaseStoreFile.toString().trim().replaceAll('^"(.*)"$', '$1')
def releaseStorePassword = keystoreProperties['storePassword'] ?: System.getenv("SOPA_STORE_PASSWORD")
def releaseKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv("SOPA_KEY_ALIAS") ?: "sopareleasekey"
def releaseKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv("SOPA_KEY_PASSWORD")
def needsReleaseSigning = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

repositories {
    google()
    mavenCentral()
}

jacoco {
    toolVersion = '0.8.11'
}

android {
    namespace 'com.sopaapp'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.sopaapp"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 14
        versionName "3.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            storeFile file(releaseStoreFile)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            testCoverageEnabled true
        }
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
}

if (needsReleaseSigning && (!releaseStorePassword || !releaseKeyPassword)) {
    throw new GradleException(
            "Missing release signing credentials. Set storePassword/keyPassword in keystore.properties " +
            "or env vars SOPA_STORE_PASSWORD and SOPA_KEY_PASSWORD."
    )
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':andengine')
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.mockito:mockito-core:5.12.0"
}

task jacocoTestReport(type: JacocoReport, dependsOn: "testDebugUnitTest") {
    group = "Reporting"
    description = "Generate Jacoco coverage reports"

    classDirectories.setFrom(fileTree(
            dir: "${buildDir}/intermediates/javac/debug/classes",
            excludes: ['**/R.class',
                       '**/R$*.class',
                       '**/*$ViewInjector*.*',
                       '**/BuildConfig.*',
                       '**/Manifest*.*']
    ))

    sourceDirectories.setFrom(files("src/main/java"))
    executionData.setFrom(fileTree(
            dir: buildDir,
            includes: ['jacoco/testDebugUnitTest.exec']
    ))

    reports {
        xml.required = true
        html.required = true
    }
}
